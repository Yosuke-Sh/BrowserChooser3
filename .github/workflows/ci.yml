name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BrowserChooser3.sln

      - name: Build (Release)
        run: dotnet build BrowserChooser3.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BrowserChooser3.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory BrowserChooser3.Tests/TestResults

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: BrowserChooser3.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
